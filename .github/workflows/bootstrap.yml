name: Bootstrap

# docs-only changes skip both Windows jobs, which cost twice the minutes of a Linux runner each. The
# workflow still starts so the required checks report skipped (a pass) rather than never appearing,
# which would hold a docs-only pull request open for ever
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  # decides on a cheap Linux runner whether anything outside the docs changed
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Look for changes outside the docs
        id: filter
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-${MERGE_BASE:-$PUSH_BEFORE}}"
          # an unknown base (a new branch or a first push) runs everything rather than guessing
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # a real Windows 11 runner: the analyzer, the Pester tests and a full plan-mode run, which reads
  # the package list and walks every stage without installing anything
  tests:
    name: Tests (Windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install test modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path ./bootstrap -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $findings | Format-Table -AutoSize
          if ($findings) { exit 1 }

      - name: Run Pester tests
        shell: pwsh
        run: |
          $result = Invoke-Pester ./tests -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Plan a full run
        shell: pwsh
        env:
          WINDOWS_BOOTSTRAP_REPOS_DIR: ${{ runner.temp }}\repos
        run: ./bootstrap/bootstrap.ps1 -Plan

  # every identifier in the package list must still exist in the winget catalogue
  packages:
    name: Package list (winget)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Look up every package
        shell: pwsh
        run: |
          $ids = (Get-Content -Raw packages/winget.json | ConvertFrom-Json).Sources.Packages.PackageIdentifier
          $missing = foreach ($id in $ids) {
            $found = winget show --id $id --exact --accept-source-agreements --disable-interactivity 2>$null
            if ($LASTEXITCODE -ne 0) { $id }
          }
          if ($missing) { "Not in the winget catalogue: $($missing -join ', ')"; exit 1 }
          "All $($ids.Count) packages found"
